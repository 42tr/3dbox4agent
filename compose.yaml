services:
  world:
    build:
      context: .
      dockerfile: packages/world/Dockerfile
      target: ${BOX_IMAGE_TARGET:-world}
    image: ${BOX_IMAGE_NAME:-3dbox4agent-local}:${BOX_IMAGE_TARGET:-world}
    init: true
    environment:
      BOX_REPLAY_JOURNAL: ${BOX_REPLAY_JOURNAL:-1}
      BOX_WORLD_WORKERS: ${BOX_WORLD_WORKERS:-4}
    volumes:
      - world-data:/app/.3dbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    stop_grace_period: 10s
  control:
    build:
      context: .
      dockerfile: packages/control-server/Dockerfile
    image: ${BOX_IMAGE_NAME:-3dbox4agent-local}:control
    ports:
      - "127.0.0.1:${BOX_CONTROL_PORT:-8789}:8789"
    depends_on:
      world:
        condition: service_healthy
    init: true
    environment:
      WORLD_URL: http://world:8787
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  console:
    build:
      context: .
      dockerfile: packages/console/Dockerfile
    image: ${BOX_IMAGE_NAME:-3dbox4agent-local}:console
    ports:
      - "127.0.0.1:${BOX_HTTP_PORT:-8787}:8787"
    depends_on:
      control:
        condition: service_healthy
    environment:
      BOX_CONTROL_URL: http://control:8789
      BOX_WORLD_URL: http://world:8787
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  runner:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    image: ${BOX_IMAGE_NAME:-3dbox4agent-local}:agent
    profiles:
      - experiments
    depends_on:
      world:
        condition: service_healthy
      control:
        condition: service_healthy
    environment:
      BOX_WORLD_URL: http://world:8787
      BOX_CONTROL_URL: http://control:8789
      NO_PROXY: world,control,console,localhost,127.0.0.1
      no_proxy: world,control,console,localhost,127.0.0.1
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    stop_grace_period: 10s
volumes:
  world-data:
