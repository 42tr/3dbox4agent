services:
  world:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${BOX_HTTP_BIND:-0.0.0.0}:${BOX_HTTP_PORT:-8787}:8787"
    environment:
      BOX_REPLAY_JOURNAL: "1"
      BOX_WORLD_WORKERS: ${BOX_WORLD_WORKERS:-2}
    volumes:
      - world-data:/app/.3dbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    stop_grace_period: 10s
  runner:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    profiles:
      - experiments
    depends_on:
      world:
        condition: service_healthy
    network_mode: service:world
    init: true
    entrypoint:
      - python3
      - sdk/python/multi_agent_demo.py
    command:
      - --fault
      - none
      - --physics
      - rapier
      - --archive
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 1024
    stop_grace_period: 10s
volumes:
  world-data:
