services:
  world:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${BOX_HTTP_BIND:-0.0.0.0}:${BOX_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:${BOX_CONTROL_PORT:-8789}:8789"
    environment:
      BOX_REPLAY_JOURNAL: "1"
      BOX_WORLD_WORKERS: ${BOX_WORLD_WORKERS:-2}
    volumes:
      - world-data:/app/.3dbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    stop_grace_period: 10s
  control:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    network_mode: service:world
    depends_on:
      world:
        condition: service_healthy
    init: true
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/threebox-control-server"]
    environment:
      CONTROL_BIND: 0.0.0.0:8789
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/world/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
  runner:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    profiles:
      - experiments
    depends_on:
      world:
        condition: service_healthy
      control:
        condition: service_healthy
    network_mode: service:world
    init: true
    entrypoint:
      - python3
      - sdk/python/multi_agent_demo.py
    command:
      - --fault
      - none
      - --physics
      - rapier
      - --archive
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 1024
    stop_grace_period: 10s
volumes:
  world-data:
