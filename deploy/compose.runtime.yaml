services:
  world:
    image: ${BOX_IMAGE:?Set BOX_IMAGE to the loaded release image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      BOX_REPLAY_JOURNAL: "1"
      BOX_WORLD_WORKERS: ${BOX_WORLD_WORKERS:-2}
    volumes:
      - world-data:/app/.3dbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    stop_grace_period: 10s
  control:
    image: ${BOX_CONTROL_IMAGE:?Set BOX_CONTROL_IMAGE to the loaded Control image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    ports:
      - "127.0.0.1:${BOX_CONTROL_PORT:-8789}:8789"
    depends_on:
      world:
        condition: service_healthy
    init: true
    restart: unless-stopped
    environment:
      WORLD_URL: http://world:8787
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  console:
    image: ${BOX_CONSOLE_IMAGE:?Set BOX_CONSOLE_IMAGE to the loaded Console image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    ports:
      - "${BOX_HTTP_BIND:-0.0.0.0}:${BOX_HTTP_PORT:-8787}:8787"
    depends_on:
      control:
        condition: service_healthy
    environment:
      BOX_CONTROL_URL: http://control:8789
      BOX_WORLD_URL: http://world:8787
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  runner:
    image: ${BOX_AGENT_IMAGE:?Set BOX_AGENT_IMAGE to the loaded Agent image}
    platform: ${BOX_PLATFORM:-linux/amd64}
    pull_policy: never
    profiles:
      - experiments
    depends_on:
      world:
        condition: service_healthy
      control:
        condition: service_healthy
    environment:
      BOX_WORLD_URL: http://world:8787
      BOX_CONTROL_URL: http://control:8789
      NO_PROXY: world,control,console,localhost,127.0.0.1
      no_proxy: world,control,console,localhost,127.0.0.1
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 1g
    pids_limit: 1024
    stop_grace_period: 10s
volumes:
  world-data:
